# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect sv410/fintrack
#
# Or configure each service manually (see README → Deploy on Render).

databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack
    user: fintrack

services:
  # Express API (Web Service — Node)
  - type: web
    name: fintracks
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString

  # React frontend (Static Site)
  - type: web
    name: fintrack
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:static
    staticPublishPath: artifacts/finance-tracker/dist/public
    envVars:
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fintracks-v8gr.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
