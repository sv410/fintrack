# Single-service deploy on Render (frontend + API on one URL)
#
# Create: New → Web Service (NOT Static Site) → connect sv410/fintrack
# Also create: New → PostgreSQL → link DATABASE_URL to the web service

databases:
  - name: fintrack-db
    plan: free
    databaseName: fintrack
    user: fintrack

services:
  - type: web
    name: fintrack
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:full
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
